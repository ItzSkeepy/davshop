<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - DavShop</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <nav class="navbar">
    <a href="/" class="logo">Dav<span>Shop</span> <span style="font-size: 0.8rem; color: var(--red);">Admin</span></a>
    <ul class="nav-links">
      <li><a href="/">← Retour au site</a></li>
      <li><a href="#" onclick="logout()" id="logoutBtn" style="display:none; color: var(--red);">Déconnexion</a></li>
    </ul>
  </nav>

  <section class="section" style="padding-top: 120px; min-height: 100vh;">

    <!-- LOGIN -->
    <div class="admin-login" id="adminLogin">
      <h2 class="section-title">🔐 Espace Admin</h2>
      <p class="section-subtitle">Connectez-vous pour gérer les commandes.</p>
      <div class="form-container" style="max-width: 400px;">
        <form onsubmit="adminLogin(event)">
          <div class="form-group">
            <label>Mot de passe</label>
            <input type="password" id="adminPassword" placeholder="Mot de passe admin" required>
          </div>
          <div id="loginAlert"></div>
          <button type="submit" class="btn btn-red" style="width: 100%; justify-content: center;">
            🔓 Se connecter
          </button>
        </form>
      </div>
    </div>

    <!-- DASHBOARD -->
    <div class="admin-dashboard" id="adminDashboard">
      <h2 class="section-title">📊 Tableau de bord</h2>
      <p class="section-subtitle">Gérez toutes les commandes DavShop.</p>

      <div class="admin-stats" id="adminStats"></div>

      <div class="orders-table">
        <table>
          <thead>
            <tr>
              <th>Code</th>
              <th>Client</th>
              <th>Produit</th>
              <th>Date</th>
              <th>Statut</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="ordersBody">
          </tbody>
        </table>
      </div>
    </div>

  </section>

  <!-- MODAL EDIT -->
  <div class="modal-overlay" id="editModal">
    <div class="modal">
      <h3>✏️ Modifier la commande</h3>
      <input type="hidden" id="editId">

      <div class="form-group">
        <label>Client</label>
        <input type="text" id="editName" disabled>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="text" id="editEmail" disabled>
      </div>

      <div class="form-group">
        <label>Téléphone</label>
        <input type="text" id="editPhone" disabled>
      </div>

      <div class="form-group">
        <label>Lien du produit</label>
        <input type="text" id="editLink" disabled>
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea id="editDescription" disabled></textarea>
      </div>

      <div class="form-group">
        <label>Adresse</label>
        <textarea id="editAddress" disabled></textarea>
      </div>

      <div class="form-group">
        <label>Statut</label>
        <select id="editStatus">
          <option value="Demande reçue">Demande reçue</option>
          <option value="Commande passée">Commande passée</option>
          <option value="En livraison">En livraison</option>
          <option value="Arrive bientôt">Arrive bientôt</option>
          <option value="Livré">Livré</option>
        </select>
      </div>

      <div class="form-group">
        <label>Notes admin</label>
        <textarea id="editNotes" placeholder="Notes internes..."></textarea>
      </div>

      <div style="display: flex; gap: 10px;">
        <button class="btn btn-primary" onclick="saveOrder()" style="flex:1; justify-content: center;">Sauvegarder</button>
        <button class="btn btn-secondary" onclick="closeModal()" style="flex:1; justify-content: center;">Annuler</button>
      </div>
    </div>
  </div>

  <script src="/js/admin.js"></script>
</body>
</html>
